<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册主账号 - 星座命理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="brand">
      <div class="logo">星座命理</div>
      <div class="slogan">八字格局 · 五行喜用 · 传统文化参考</div>
    </div>
    <div class="card">
      <h2>注册主账号</h2>
      <p class="sub">第一个注册的账号将作为主账号</p>
      <div class="field"><input id="username" placeholder="设置账号（至少3位）" autocomplete="username"></div>
      <div class="field"><input id="password" type="password" placeholder="设置密码（至少6位）" autocomplete="new-password"></div>
      <button class="btn btn-primary" onclick="doRegister()">注册</button>
      <p style="text-align:center;margin-top:14px;font-size:13px;color:var(--ink-soft)">已有账号？<a href="login.html" style="color:var(--cinnabar)">去登录</a></p>
      <p id="msg" class="msg" style="text-align:center"></p>
    </div>
  </div>
  <script src="js/common.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
