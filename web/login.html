<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 星座命理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="brand">
      <div class="logo">星座命理</div>
      <div class="slogan">八字格局 · 五行喜用 · 传统文化参考</div>
    </div>
    <div class="card">
      <h2>登录</h2>
      <div class="field"><input id="username" placeholder="账号" autocomplete="username"></div>
      <div class="field"><input id="password" type="password" placeholder="密码" autocomplete="password"></div>
      <button class="btn btn-primary" onclick="doLogin()">登录</button>
      <p style="text-align:center;margin-top:14px;font-size:13px;color:var(--ink-soft)">还没有账号？<a href="register.html" style="color:var(--cinnabar)">注册主账号</a></p>
      <p id="msg" class="msg" style="text-align:center"></p>
    </div>
  </div>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
