<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 星座命理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>星座命理</h1>
      <p class="sub">登录你的账号</p>
      <input id="username" placeholder="账号" autocomplete="username">
      <input id="password" type="password" placeholder="密码" autocomplete="password">
      <button onclick="doLogin()">登录</button>
      <p class="tip">还没有账号？<a href="register.html">注册主账号</a></p>
      <p id="msg" class="msg"></p>
    </div>
  </div>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
