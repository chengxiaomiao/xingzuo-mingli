# Render 部署配置（免费版）
# 在 Render 控制台「New → Web Service」选择本仓库后，Render 会自动读这个文件。
# SQLite 文件数据库随应用部署，无需任何外部数据库配置。
services:
  - type: web
    name: xingzuo-mingli-web
    runtime: node
    plan: free
    region: oregon        # 就近选，新加坡可选 singapore
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
